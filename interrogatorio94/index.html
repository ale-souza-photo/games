<title>Interrogatório 94</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&family=Special+Elite&display=swap">
<style>
/* Layout: uma tela de jogo em coluna. Faixa de título com relógio, abas dos suspeitos, quadro de mangá com o retrato (a prova mostrada aparece por cima dele), caixa de diálogo datilografada e pilha de ações. Seleção de casos, dossiê, caderno e relatório abrem como folhas por cima. */
:root{

  --clock:#e3b04b;

  --font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
button{-webkit-appearance:none;appearance:none;font-family:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@supports(height:100dvh){html,body,.app{height:100dvh}}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:17px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.app{height:100%;max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left),env(safe-area-inset-right));padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(150px,1fr) auto auto;gap:8px;overflow:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:flex-end;gap:8px;flex:none}
.top{min-width:0}
.tools{position:absolute;right:6px;top:6px;display:flex;gap:5px;z-index:2}
.tool{background:var(--paper);border:2px solid #000;color:var(--paper-ink);min-height:34px;min-width:44px;padding:0 8px;font:600 14px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.tool:hover{background:#fff}
.tool:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.clock .l{font-size:12px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.clock b{font-family:var(--font-type);font-weight:400;font-size:26px;color:var(--clock);font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--mute);min-height:44px;padding:4px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;font:600 16px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0;overflow:hidden}
.tab span:first-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{color:var(--fg);border-color:var(--pen);background:#20253a}

.pips{display:flex;gap:3px}

.pips i.on{background:var(--clock)}
.stage{container-type:size;min-height:0;display:grid;place-items:center}
.panel{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);aspect-ratio:1/1;border:4px solid #000;background:var(--paper);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.panel canvas#cv{display:block;width:100%;height:100%}
.plate{position:absolute;left:-4px;top:-4px;background:var(--paper);color:var(--paper-ink);border:3px solid #000;padding:3px 9px 4px;max-width:58%}

.plate span{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;line-height:1.1}

.evpop .evt{font-size:11.5px;padding:3px 8px 5px;line-height:1.3}

.dlg{background:var(--panel);border:1px solid var(--line);padding:9px 12px 10px;min-height:118px;cursor:pointer}
.who{font-family:var(--font-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
.narr{margin:2px 0 4px;font-size:16px;font-style:italic;font-weight:500;color:var(--mute);line-height:1.2}
.say{margin:0;font-family:var(--font-type);font-size:15px;line-height:1.4;min-height:1.4em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:36vh;overflow-y:auto;align-content:start}
.acts .full{grid-column:1/-1}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);min-height:46px;padding:8px 12px;text-align:left;font:600 18px/1.1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border-radius:0}

.btn:hover{border-color:var(--pen)}
.btn.main{background:#20253a;border-color:var(--pen-deep)}

.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.hint{grid-column:1/-1;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:2px}

.paper{background:var(--paper);color:var(--paper-ink);max-width:560px;margin:0 auto;padding:18px 18px 20px;font-family:var(--font-type);font-size:15px;line-height:1.5}
.paper h1{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px;line-height:1.05;text-wrap:balance}
.paper h2{font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 4px;padding-bottom:2px;border-bottom:2px solid var(--paper-ink)}
.paper .stamp{font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--pen-deep)}
.paper p{margin:8px 0}
.paper ul{margin:4px 0;padding-left:18px}
.paper li{margin:3px 0}
.paper .pen{color:var(--pen-deep)}
.paper .btn{margin-top:14px;background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink);width:100%;text-align:center}
.paper .btn.ghost{background:transparent;color:var(--paper-ink)}
.paper .row{display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{border:2px solid var(--paper-ink);padding:6px 8px;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.stats b{display:block;font-family:var(--font-type);font-weight:400;font-size:22px;letter-spacing:0;font-variant-numeric:tabular-nums}
/* seleção de casos */
.cases{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cases .btn{margin:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start;position:relative;min-height:70px;text-align:left;background:transparent;color:var(--paper-ink);border:2px solid var(--paper-ink)}
.cases .btn b{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.05em;line-height:1.1}
.cases .btn span{font-family:var(--font-ui);font-weight:600;font-size:13px;letter-spacing:.12em;opacity:.75}
.cases .btn.done{background:var(--paper-ink);color:var(--paper)}
.cases .btn .mk{position:absolute;right:8px;top:6px;font-family:var(--font-ui);font-size:13px;letter-spacing:.1em}
.dots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.dots i{width:7px;height:7px;border:1px solid currentColor;display:inline-block}
.dots i.on{background:currentColor}
/* provas */
.evc{background:var(--paper);color:var(--paper-ink);border:2px solid #000;font-family:var(--font-type)}
.evh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 9px;border-bottom:2px solid #000;background:#d3cfc4}
.evh b{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.05em;text-transform:uppercase}

.evt{margin:0;padding:4px 9px 8px;font-size:13px;line-height:1.35}
.tk{background:#f1efe8;border:1px dashed #000;padding:8px 14px;width:min(100%,260px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

.dch{font-family:var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid #000;margin-bottom:4px;padding-bottom:2px}

.dc p.pen{color:var(--pen-deep)}
.np{background:#e9e5d8;border:1px solid #000;padding:7px 10px;width:100%}
.npm{font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:4px}

.npc{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}

.lab{width:100%;font-family:var(--font-ui)}
.labt{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.lab svg{display:block;width:100%;height:auto;background:#f6f4ee;border:1px solid #000}

.br b{font-family:var(--font-type);font-weight:400;font-size:12.5px}
.mt{display:flex;align-items:center;justify-content:space-between;gap:6px}

.pc{font-family:var(--font-display);font-size:24px}

.evgrid{display:grid;gap:12px;margin-top:8px}
.paper .evc{box-shadow:none}

  var tps=su.tp.map(function(t,ti){
   return {id:'s'+si+'t'+ti,q:t.q,says:t.says,short:t.short,lie:t.lie,ck:t.ck,cs:t.cs,ul:t.ul,claim:'s'+si+'t'+ti,cclaim:'s'+si+'t'+ti+'c'};
  });
  SUS.push({name:su.name,role:su.role,temper:su.temper,weak:WEAK[su.temper],look:look,intro:su.intro,clear:su.clear,voice:vc,topics:tps});
 });
 Object.keys(C.ev).forEach(function(k){var e=C.ev[k];EVS[k]={id:k,name:e.name,text:e.text,kind:e.kind,data:e.data,hidden:e.hidden}});

 C.conf.forEach(function(f,k){

  CONF[f.ev+'|'+claim]={d:f.d,nel:f.nel,narr:f.narr,say:f.say,si:+m[0],rev:f.rev?{claim:'s'+m[0]+'r'+k,short:f.rev}:null};

 });

 else setDialog(sp.name,'Você retoma com '+first(sp.name)+'.','');

}
function afterAction(){
 refresh();
 if(S.over)return;

 if(S.shut.every(function(x){return x})){setTimeout(function(){openAccuse(true,'Os três pediram advogado. O delegado Moura bate na porta: Quem eu indicio?')},1400);return}
 if(S.el>=C.limit){setTimeout(function(){openAccuse(true,'O prazo acabou. O delegado Moura bate na porta: Quem eu indicio?')},1400)}
}
function breakCheck(i){
 var sp=SUS[i],T=sp.temper;
 if(S.stress[i]>=100){
  if(i===C.culprit&&proofs()>=C.need){
   S.confessed=true;S.menu='confessed';
   setDialog(sp.name,C.confession[0],C.confession[1]);
   emote(T==='hot'||T==='proud'?'rage':(T==='nervous'?'panic':'cry'));
   return true;
  }
  S.shut[i]=true;S.lawyers++;S.menu='main';
  setDialog(sp.name,'A tensão estourou. '+SHUT[T][0],SHUT[T][1]);emote(SHUT[T][2]);return true;
 }
 if(S.strikes[i]>=3){
  S.shut[i]=true;S.lawyers++;S.menu='main';
  setDialog(sp.name,'Paciência esgotada. '+SHUT[T][0],SHUT[T][1]);emote(SHUT[T][2]);return true;
 }
 return false;
}
function doAsk(tone){
 var i=S.cur,sp=SUS[i],tp=null,T=sp.temper;
 sp.topics.forEach(function(t){if(t.id===S.pick)tp=t});
 if(!tp)return;
 var st=S.asked[tp.id]||(S.asked[tp.id]={n:false,c:false});
 S.el+=10;
 var narr='',say='',d=0,strike=0,tell=false,mood=null;
 if(tone===sp.weak){
  if(!st.c){
   st.c=true;st.n=true;say=tp.ck;d=15;narr=CRACK[T][0];mood=CRACK[T][1];
   addTest(i,tp.claim,tp.short,false);
   addTest(i,tp.cclaim,tp.cs,false);
   if(tp.ul&&unlock(tp.ul))narr+=' Nova prova no caderno: '+EVS[tp.ul].name+'.';
  }else{say='Já disse tudo o que tinha pra dizer sobre isso.';d=4;narr=first(sp.name)+' não tem mais nada a abrir aqui.';mood='sigh'}
 }else{
  if(!st.n){st.n=true;say=tp.says;addTest(i,tp.claim,tp.short,tp.lie);tell=tp.lie}
  else say='Já respondi isso. Não tenho mais o que acrescentar.';
  var r=REACT[T][tone]||['',null];
  narr=r[0];mood=r[1];
  d=tone==='pressionar'?8:(tone==='provocar'?7:-6);
  if(tone!=='acolher'&&S.stress[i]>=60){strike=1;narr+=' Passou da conta.';mood='grunt'}
 }
 S.stress[i]=clamp(S.stress[i]+d,0,100);
 S.strikes[i]+=strike;
 S.menu='main';
 if(tell)S.tell=1.9;
 setDialog(sp.name,narr,say);
 emote(mood);
 breakCheck(i);
 afterAction();
}
function doConfront(claim){
 var i=S.cur,sp=SUS[i],T=sp.temper,key=S.pickEv+'|'+claim;
 if(S.exposed.indexOf(key)>=0){
  S.menu='main';setDialog(sp.name,'Você já usou essa prova contra essa frase.','');afterAction();return;
 }
 S.el+=10;
 var c=CONF[key],narr,say,mood;
 if(c){
  S.exposed.push(key);
  S.stress[i]=clamp(S.stress[i]+c.d,0,100);
  narr=c.narr;say=c.say;
  if(c.rev)addTest(i,c.rev.claim,c.rev.short,false);
  mood=c.d<0?'sigh':(c.d>=26&&T==='sad'?'gasp':CRACK[T][1]);
 }else{
  S.strikes[i]+=1;S.stress[i]=clamp(S.stress[i]+4,0,100);
  narr='A prova não contradiz essa frase. '+first(sp.name)+' percebe.';
  say=WRONG[T];mood=WRONGMOOD[T];
 }
 S.menu='main';
 setDialog(sp.name,narr,say);
 emote(mood);
 breakCheck(i);
 afterAction();
}

 if(!M.scene&&S.el>=30&&!Object.keys(S.scn).length){M.scene=1;toast('Você ainda não pisou na cena. A perícia já isolou o local. Dê uma olhada.')}
 if(!M.a&&p>=0.5){M.a=1;toast('Metade do prazo foi. A imprensa está na porta da delegacia.')}
 if(!M.b&&p>=0.75){M.b=1;toast('Faltam poucas horas. O delegado-geral quer um nome. Eu preciso de provas, não de achismo.')}
 if(!M.c&&p>=0.9){M.c=1;toast('Última hora. Se não tem confissão, tem que ter prova. Decida.')}
 C.rel.forEach(function(t,si){
  if(S.released[si]||S.el<t)return;

  S.released[si]=true;S.shut[si]=true;

  if(S.cur===si)S.menu='main';
 });

function doSilence(){

 narr=N[T];

 if(tell){S.tell=2.4;narr+' '}

 else{S.strikes[i]+=1;S.stress[i]=clamp(S.stress[i]+5,0,100);narr=x.tell?'Você blefa, mas '+first(sp.name)+' não se abala.':'Você blefa, mas essa frase não tinha mentira. A cara de pau não funciona.';say=x.tell?'Prove. Se tem, mostre.':WRONG[T];mood=WRONGMOOD[T]}

    var b=ev.target.closest('button');if(!b)return;

    var h2=$('#scev');h2.innerHTML='';
    if(m==='lupa'){var zc=showEv(h2,s.ev,'normal');var z=document.createElement('div');z.className='zoomw z';var cv=zc.querySelector('canvas');cv.parentNode.replaceChild(z,cv);z.appendChild(cv);h2.appendChild(zc);
     z.addEventListener('pointermove',function(e){var r=z.getBoundingClientRect();cv.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%'});
     z.addEventListener('click',function(){z.classList.toggle('z')})}
    else h2.appendChild(showEv(h2,s.ev,m));
    if(m==='po'&&s.prints){
     var got=[];s.prints.forEach(function(k){if(!S.scn['pr_'+k]){S.scn['pr_'+k]=1;addTime(5)}if(unlock(k))got.push(EVS[k].name)});
     s.prints.forEach(function(k){h2.appendChild(showEv(h2,k,'normal'))});
     if(got.length){toast('Pó revelou digitais. Nova prova: '+got.join(', ')+'.','Perícia')}
     scnCount();afterSceneTime();
    }
   });
  }
 }
 if(msg){var m2=document.createElement('p');m2.className='pen';m2.textContent=msg;p.appendChild(m2)}
 var tt=$('#scn');if(tt)scnCount();
 var sp=document.querySelector('.spt[data-s="'+id+'"]');if(sp){sp.classList.add('on');sp.querySelector('b').textContent=s.kind==='decoy'?'·':(SCN.spots.indexOf(s)+1)}
 p.scrollIntoView({block:'nearest',behavior:'smooth'});
 if(first)afterSceneTime();
}
function afterSceneTime(){refresh();checkEvents();if(S.el>=C.limit){$('#scene').hidden=true;setTimeout(function(){openAccuse(true,'O prazo acabou. O delegado Moura bate na porta: Quem eu indicio?')},400)}}
$('#scene').addEventListener('click',function(ev){
 if(ev.target.id==='closeScene'){$('#scene').hidden=true;return}
 var b=ev.target.closest('.spt');if(b)openSpot(b.dataset.s);
});

/* ----- caderno com quadro de provas ----- */
var mugs={};
function mug(si){
 var k=C.id+si;if(mugs[k])return mugs[k];
 var big=document.createElement('canvas');big.width=big.height=800;
 var t1=document.createElement('canvas');t1.width=t1.height=200;var tg1=t1.getContext('2d',{willReadFrequently:true});
 try{Face.paint(big.getContext('2d'),tg1,t1,SUS[si],si,0.22,1.2,{mood:null,w:0,tell:false,shut:false})}catch(e){}
 var s=document.createElement('canvas');s.width=s.height=220;s.getContext('2d').drawImage(big,40,20,720,720,0,0,220,220);mugs[k]=s;return s;
}
function pol(cls,r){var d=document.createElement('div');d.className='pol '+(cls||'');d.style.setProperty('--r',r+'deg');d.innerHTML='<i class="pin"></i>';return d}
function buildBoard(host){
 var bd=document.createElement('div');bd.className='bd';
 var row=document.createElement('div');row.className='bdr';var nodes={};
 SUS.forEach(function(sp,i){
  var p=pol(S.shut[i]?'off':'',(i-1)*2.4);var c=document.createElement('canvas');c.width=c.height=220;c.getContext('2d').drawImage(mug(i),0,0);p.appendChild(c);
  var n=document.createElement('div');n.textContent=first(sp.name);p.appendChild(n);row.appendChild(p);nodes['s'+i]=p;
 });
 bd.appendChild(row);
 var er=document.createElement('div');er.className='bdr ev';
 S.ev.forEach(function(id,k){
  var p=pol('pl',((k*37)%7-3)*1.1);p.innerHTML+=esc(EVS[id].name)+'<small>'+KIND[EVS[id].kind]+'</small>';er.appendChild(p);nodes['e'+id]=p;
 });
 bd.appendChild(er);
 var ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');bd.appendChild(svg);
 host.appendChild(bd);
 var hint=document.createElement('p');hint.className='pen';hint.textContent='Fio vermelho: contradição comprovada. Fio amarelo: prova usada, sem estrago. Sem fio: prova ainda parada.';host.appendChild(hint);
 requestAnimationFrame(function(){
  var r0=bd.getBoundingClientRect();
  function cen(n){var r=n.getBoundingClientRect();return [r.left-r0.left+r.width/2,r.top-r0.top+8]}
  S.exposed.forEach(function(key){
   var c=CONF[key];if(!c)return;var ev=key.split('|')[0],a=nodes['e'+ev],b=nodes['s'+c.si];if(!a||!b)return;
   var p1=cen(a),p2=cen(b),ln=document.createElementNS(ns,'path'),mx=(p1[0]+p2[0])/2,my=Math.max(p1[1],p2[1])*0.55+(p1[1]+p2[1])*0.22;
   ln.setAttribute('d','M'+p1[0]+' '+p1[1]+' Q'+mx+' '+(my+30)+' '+p2[0]+' '+(p2[1]+60));
   ln.setAttribute('stroke',c.nel?'#c0182a':'#d8b020');ln.setAttribute('stroke-width','2.4');ln.setAttribute('fill','none');ln.setAttribute('stroke-linecap','round');svg.appendChild(ln);
  });
 });
}
function openBook(tab){
 tab=tab||S.btab||'prov';S.btab=tab;
 var bb=$('#bookbody');bb.innerHTML='';
 var head=document.createElement('div');head.innerHTML='<div class="stamp">Caderno do investigador</div><h1>'+esc(C.title)+'</h1><div class="btabs"><button data-b="prov" class="'+(tab==='prov'?'on':'')+'">Provas</button><button data-b="quad" class="'+(tab==='quad'?'on':'')+'">Quadro</button><button data-b="dep" class="'+(tab==='dep'?'on':'')+'">Depoimentos</button></div>';
 bb.appendChild(head);
 var pane=document.createElement('div');bb.appendChild(pane);
 if(tab==='prov'){
  var grid=document.createElement('div');grid.className='evgrid';
  S.ev.forEach(function(id,k){grid.appendChild(Evi.card(id,EVS[id],{n:k+1,dt:C.dt}))});
  if(!S.ev.length)pane.innerHTML='<p>Nada coletado ainda. A cena do crime guarda as primeiras provas.</p>';
  pane.appendChild(grid);
 }else if(tab==='quad'){buildBoard(pane)}
 else{
  var th='';
  SUS.forEach(function(sp,i){
   th+='<h2>'+esc(sp.name)+' · '+esc(sp.role)+'</h2>';
   if(!S.tests[i].length)th+='<p>Nada anotado.</p>';else{
    th+='<ul>';S.tests[i].forEach(function(x){th+='<li>'+esc(x.short)+(x.tell?' <span class="pen">(desviou o olhar ao dizer isso)</span>':'')+'</li>'});th+='</ul>';
   }
  });
  pane.innerHTML=th;
 }
 var cb=document.createElement('button');cb.className='btn';cb.id='closeBook';cb.textContent='Fechar caderno';bb.appendChild(cb);
 $('#book').hidden=false;$('#book').scrollTop=0;
}
$('#book').addEventListener('click',function(ev){var b=ev.target.closest('.btabs button');if(b)openBook(b.dataset.b)});

/* ----- aviso +16 ----- */
function openWarn(){
 var ok=false;try{ok=localStorage.getItem('iv94w')==='1'}catch(e){}
 if(ok){$('#warn').hidden=true;return false}
 $('#warnbody').innerHTML='<div class="stamp">Aviso de conteúdo · +16</div><h1>Interrogatório \'94</h1><p>Este jogo é de <b>investigação policial adulta</b>. Mostra fotos de perícia com sangue, cenas de crime com corpo coberto e temas como assassinato, corrupção e chantagem. Não há violência explícita, mas o clima é pesado.</p><p>Não é para crianças. Se for jogar perto de menores, escolha outro jogo.</p><button class="btn" id="warnOk">Tenho 16 anos ou mais. Entrar</button><button class="btn ghost" id="warnNo">Sair</button>';
 $('#warn').hidden=false;return true;
}
$('#warn').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;
 if(b.id==='warnOk'){try{localStorage.setItem('iv94w','1')}catch(e){}$('#warn').hidden=true;openPick()}
 else if(b.id==='warnNo'){$('#warnbody').innerHTML='<div class="stamp">Até a próxima</div><p>Feche esta aba. Os joguinhos infantis ficam em outro endereço.</p>'}
});

/* ---------- seleção, dossiê e final ---------- */
function dots(n){var s='<span class="dots" aria-label="dificuldade '+n+' de 5">';for(var i=1;i<=5;i++)s+='<i'+(i<=n?' class="on"':'')+'></i>';return s+'</span>'}
function openPick(){
 $('#intro').hidden=true;$('#end').hidden=true;$('#book').hidden=true;
 var n=0;for(var k in PROG.done)n++;
 var h='<div class="stamp">4º Distrito Policial · Sé · Confidencial</div><h1>Interrogatório \'94</h1>';
 h+='<p>São Paulo, anos 90. Vinte casos, três suspeitos cada um, e um delegado de olho no relógio. Resolvidos: '+n+' de '+CASES.length+'.</p><div class="cases">';
 CASES.forEach(function(c,i){
  var d=PROG.done[c.id];
  h+='<button class="btn'+(d?' done':'')+'" data-c="'+i+'"><b>'+(i+1)+'. '+esc(c.title)+'</b><span>'+c.year+' · '+esc(c.where)+dots(c.diff)+'</span>'+(d?'<em class="mk">✓</em>':'')+'</button>';
 });
 h+='</div>';
 $('#pickbody').innerHTML=h;$('#pick').hidden=false;$('#pick').scrollTop=0;
 $('#bt').textContent="Interrogatório '94";$('#bs').textContent='Escolha um caso';
}
function openIntro(){
 var h='<div class="stamp">4º Distrito Policial · Sé · Confidencial</div><h1>'+esc(C.title)+'</h1>';
 C.brief.split('\n\n').forEach(function(p){h+='<p>'+esc(p)+'</p>'});
 h+='<p class="pen">Prazo: '+Math.floor(C.limit/60)+'h'+(C.limit%60?String(C.limit%60).padStart(2,'0'):'')+'. Cada ação gasta 10 minutos.</p>';
 h+='<h2>Como interrogar</h2><ul>';
 h+='<li>Escolha uma pergunta e depois o <b>tom</b>. Cada pessoa abre por um caminho diferente: pressionar, acolher ou provocar.</li>';
 h+='<li>Tom errado em quem já está no limite queima a paciência. Três avisos e vem o advogado.</li>';
 h+='<li>Observe o rosto e escute. Quando alguém mente, os olhos fogem.</li>';

 h+='<li>Antes de interrogar, <b>vá à cena do crime</b>: toque nas marcações, use lupa, luz UV e pó. As provas começam lá, e cada vistoria gasta 5 minutos.</li>';
 h+='<li><b>Silêncio</b> e <b>Blefar</b> são pressão sem prova: funcionam em quem está nervoso, triste ou de sangue quente, e falham em quem é frio ou orgulhoso. Os advogados chegam em horários diferentes: quem sai da sala não volta.</li>';
 h+='<li>No caderno, o <b>Quadro</b> mostra os fios vermelhos das contradições.</li>';
 h+='<li>Use as provas do caderno para <b>confrontar</b> uma frase que não fecha. É preciso reunir contradições suficientes contra o culpado.</li></ul>';
 h+='<button class="btn" id="go">Entrar na sala</button><button class="btn ghost" id="backPick">Outros casos</button>';
 $('#introbody').innerHTML=h;$('#intro').hidden=false;$('#intro').scrollTop=0;
}
function startCase(idx){
 loadCase(idx);resetState();
 $('#pick').hidden=true;
 $('#bt').textContent=C.title;$('#bs').textContent='Caso '+(idx+1)+' · '+C.date;
 openIntro();
 refresh();
 setDialog('Delegacia','Três suspeitos esperam na sala. Comece por quem você quiser.','');
}
function openAccuse(forced,msg){
 if(S.over)return;
 var h='<div class="stamp">Indiciamento</div><h1>Quem você indicia?</h1>';
 h+='<p>'+esc(msg?msg:'O delegado Moura espera o seu nome. Só dá para indiciar uma pessoa.')+'</p><div class="row">';
 SUS.forEach(function(sp,i){h+='<button class="btn" data-ac="'+i+'">'+esc(sp.name)+'<small style="color:inherit;opacity:.7">'+esc(sp.role)+'</small></button>'});
 if(!forced)h+='<button class="btn ghost" id="backAcc">Voltar ao interrogatório</button>';
 h+='</div>';
 $('#endbody').innerHTML=h;$('#end').hidden=false;$('#end').scrollTop=0;
}
function finish(who){
 S.over=true;
 var p=proofs(),k,t,body,cu=SUS[C.culprit];
 if(who===C.culprit){
  if(S.confessed){k='win';t='Caso resolvido';
   body=cu.name+' confessou às '+clockNow()+'. '+C.truth+' Os demais foram liberados.'}
  else if(p>=C.need){k='ok';t='Indiciamento aceito';
   body='Sem confissão, mas o delegado Moura aceita a papelada: as provas levam a '+cu.name+'. O caso segue para a Justiça com boas chances. '+C.truth}
  else{k='weak';t='Indiciamento rejeitado';
   body='Você apontou a pessoa certa, mas só tem '+p+' contradição'+(p===1?'':'ões')+' contra ela. Moura rasga o pedido: Isso não segura no juiz. Os três saem. '+C.getaway}
 }else{k='lose';t='Culpado solto';
  var sp=SUS[who];
  body=sp.name+' mentiu ou escondeu coisas, mas não cometeu o crime. '+sp.clear+' '+C.getaway}
 if(k==='win'||k==='ok'){var prev=PROG.done[C.id];if(prev!=='win')PROG.done[C.id]=k;saveProg()}
 var h='<div class="stamp">'+(k==='lose'||k==='weak'?'Relatório · Caso arquivado':'Relatório · Caso encerrado')+'</div><h1>'+esc(t)+'</h1><p>'+esc(body)+'</p>';
 h+='<div class="stats"><div>Relógio<b>'+clockNow()+'</b></div><div>Contradições<b>'+p+'/'+NEL_TOTAL+'</b></div><div>Advogados<b>'+S.lawyers+'</b></div></div>';
 if((k==='win'||k==='ok')&&cidx<CASES.length-1)h+='<button class="btn" id="nextCase">Próximo caso</button>';
 h+='<button class="btn '+((k==='win'||k==='ok')?'ghost':'')+'" id="again">Jogar este caso de novo</button><button class="btn ghost" id="toPick">Lista de casos</button>';
 $('#endbody').innerHTML=h;$('#end').hidden=false;$('#end').scrollTop=0;
 renderActions();
}

/* ---------- eventos ---------- */
$('#tabs').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;
 var i=+b.dataset.i;if(i!==S.cur)switchTo(i);
});
$('#acts').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b||S.over)return;
 var a=b.dataset.a,v=b.dataset.v;
 if(window.SFX)SFX.wake();
 if(a==='menu'){S.menu='main'}
 else if(a==='ask'){S.menu='ask'}
 else if(a==='topic'){S.pick=v;S.menu='tone'}
 else if(a==='tone'){doAsk(v);return}
 else if(a==='conf'){S.menu='conf1'}
 else if(a==='ev'){S.pickEv=v;S.menu='conf2'}
 else if(a==='claim'){doConfront(v);return}
 else if(a==='rest'){doRest();return}
 else if(a==='silence'){doSilence();return}
 else if(a==='bluff'){S.menu='bluff1'}
 else if(a==='bluffc'){doBluff(v);return}
 else if(a==='scene'){openScene();return}
 else if(a==='notes'){openBook();return}
 else if(a==='accuse'){openAccuse(false);return}
 else if(a==='finish'){finish(C.culprit);return}
 renderActions();
});
$('#book').addEventListener('click',function(ev){if(ev.target.id==='closeBook')$('#book').hidden=true});
$('#end').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;
 if(b.id==='again'){startCase(cidx);$('#end').hidden=true}
 else if(b.id==='nextCase'){$('#end').hidden=true;startCase(cidx+1)}
 else if(b.id==='toPick'){S.over=true;$('#end').hidden=true;openPick()}
 else if(b.id==='backAcc')$('#end').hidden=true;
 else if(b.dataset.ac!=null)finish(+b.dataset.ac);
});
$('#pick').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b||b.dataset.c==null)return;
 if(window.SFX)SFX.wake();
 startCase(+b.dataset.c);
});
$('#intro').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;
 if(b.id==='go'){if(window.SFX)SFX.wake();$('#intro').hidden=true;S.started=true;switchTo(0)}
 else if(b.id==='backPick'){$('#intro').hidden=true;openPick()}
});
$('#bcases').addEventListener('click',function(){S.over=true;openPick()});
function paintSnd(){$('#bsnd').textContent=PROG.snd?'Som':'Mudo';$('#bsnd').setAttribute('aria-pressed',PROG.snd?'true':'false')}
$('#bsnd').addEventListener('click',function(){
 PROG.snd=!PROG.snd;if(window.SFX){SFX.setMuted(!PROG.snd);if(PROG.snd){SFX.wake();if(SUS.length)SFX.play('grunt',SUS[S.cur].voice)}}
 saveProg();paintSnd();
});
if(window.SFX)SFX.setMuted(!PROG.snd);
paintSnd();

/* ---------- retrato ---------- */
var cv=$('#cv'),ctx=cv.getContext('2d');
cv.width=800;cv.height=800;
var tcv=document.createElement('canvas');tcv.width=200;tcv.height=200;
var tg=tcv.getContext('2d',{willReadFrequently:true});
var last=0,lastT=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 var dt=(now-lastT)/1000;lastT=now;
 if(!C||!SUS.length)return;
 if(S.tell>0)S.tell=Math.max(0,S.tell-dt);
 var w=0;
 if(S.mood){
  S.mood.t+=dt;
  var m=S.mood;
  if(m.t>=m.T)S.mood=null;
  else w=Math.min(1,m.t/0.22)*(1-clamp((m.t-(m.T-0.7))/0.7,0,1));
 }
 if(now-last<115)return;last=now;
 disp+=(S.stress[S.cur]/100-disp)*0.3;
 var sp=SUS[S.cur];
 Face.paint(ctx,tg,tcv,sp,S.cur,clamp(disp,0,1),now/1000,{mood:S.mood?S.mood.k:null,w:w,tell:S.tell>0,shut:S.shut[S.cur]});
}
window.__IV={state:function(){return S},kase:function(){return C},cases:function(){return CASES.length}};
loadCase(0);resetState();refresh();
setDialog('Delegacia','Escolha um caso para começar.','');
if(!openWarn())openPick();
requestAnimationFrame(loop);
})();


</script>
